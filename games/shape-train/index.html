<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<title>Shape Train</title>
<style>
  :root {
    --sky: #8fd3ff;
    --grass: #5cc15c;
    --ink: #1d1d1d;
    --gold: #ffc400;
    --wood: #b5793c;
    --rail: #6b6f76;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--sky);
    font-family: "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  #menu {
    background: linear-gradient(var(--sky) 0 60%, var(--grass) 60% 100%);
    align-items: center; justify-content: center; gap: 2.5vh;
  }
  #menu h1 {
    margin: 0; font-size: clamp(36px, 10vh, 92px); font-weight: 900; letter-spacing: 1px;
    color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 6px 0 rgba(0,0,0,.2);
  }
  .menu-row { display: flex; gap: 2.5vw; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .big-choice {
    width: clamp(190px, 28vw, 340px); height: clamp(170px, 42vh, 320px);
    background: #fff; border: 8px solid var(--ink); border-radius: 34px;
    box-shadow: 0 10px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    padding: 16px;
  }
  .big-choice:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); }
  .big-choice .pic { width: 100%; height: 66%; display: flex; align-items: center; justify-content: center; gap: 3%; }
  .big-choice .pic svg { height: 100%; width: auto; max-width: 31%; overflow: visible; }
  #picLoad svg, #picCorners svg { max-width: 100%; }
  .big-choice .lbl { font-size: clamp(24px, 5.5vh, 46px); font-weight: 900; }

  .parent {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 14px;
    font-size: 17px; font-weight: 700; max-width: calc(100% - 24px);
  }
  .parent .gap { width: 12px; }
  .parent button {
    border: 3px solid var(--ink); background: #fff; border-radius: 999px;
    min-width: 46px; height: 42px; padding: 0 12px; font-size: 18px; font-weight: 900;
  }
  .parent button.on { background: var(--gold); }

  .icon-btn {
    width: clamp(56px, 11vh, 90px); height: clamp(56px, 11vh, 90px); flex: none;
    border: 5px solid var(--ink); border-radius: 50%; background: #fff;
    font-size: clamp(28px, 6vh, 48px); line-height: 1;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    box-shadow: 0 5px 0 var(--ink);
  }
  .icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .corner { position: absolute; top: 16px; left: 16px; }

  /* ---------- Top bar ---------- */
  .topbar {
    height: clamp(72px, 15vh, 120px); flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 0 14px; background: var(--sky);
    border-bottom: 6px solid var(--ink);
  }
  .prompt {
    display: flex; align-items: center; gap: 12px;
    height: 84%; padding: 0 20px;
    background: #fff; border: 6px solid var(--ink); border-radius: 26px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .prompt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .prompt .speaker { font-size: clamp(24px, 5.5vh, 46px); }
  .prompt .sign { height: 80%; display: flex; align-items: center; }
  .prompt .sign svg { height: 100%; width: auto; overflow: visible; }
  .prompt .sign.num { font-size: clamp(40px, 10vh, 86px); font-weight: 900; min-width: 1.2em; justify-content: center; }
  .prompt .sign.pulse { animation: pulse .5s; }
  .stars { display: flex; gap: 4px; font-size: clamp(24px, 6vh, 50px); line-height: 1; min-width: clamp(56px, 11vh, 90px); justify-content: flex-end; }
  .stars span { color: rgba(0,0,0,.18); transition: color .3s; }
  .stars span.got { color: var(--gold); -webkit-text-stroke: 2px var(--ink); animation: pop .5s; }

  /* ---------- Picture builder ---------- */
  #buildScreen .site { flex: 1; display: flex; flex-direction: column; background: linear-gradient(var(--sky) 0 74%, var(--grass) 74% 100%); }
  #blueprint {
    flex: 1; position: relative; margin: 1.5vh auto; aspect-ratio: 1 / 1; height: 96%;
  }
  .part { position: absolute; }
  .part svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .part.hole svg { opacity: .55; }
  .part.target svg { animation: glow 1.1s ease-in-out infinite; }
  .part.placed { animation: pop .45s; }

  .tray {
    flex: none; height: 24vh; display: flex; align-items: center; justify-content: center; gap: 6vw;
    background: rgba(255,255,255,.35); border-top: 6px solid var(--ink);
  }
  .piece {
    width: min(18vh, 20vw); height: min(18vh, 20vw);
    background: none; border: 0; padding: 0;
    transition: transform .55s cubic-bezier(.4,0,.3,1), opacity .3s;
  }
  .piece svg { width: 100%; height: 100%; overflow: visible; }
  .piece.wrong { animation: shake .5s; }
  .piece.gone { opacity: 0; }

  /* ---------- Loading the train ---------- */
  #loadScreen .site { flex: 1; position: relative; background: linear-gradient(var(--sky) 0 66%, var(--grass) 66% 100%); overflow: hidden; }
  #train { position: absolute; left: 4%; top: 4%; width: min(74%, 150vh); transition: transform 1.8s cubic-bezier(.55,0,.85,.4); }
  #train.away { transform: translateX(130vw); }
  #train svg { width: 100%; height: auto; display: block; overflow: visible; }
  #rails {
    position: absolute; left: 0; right: 0; top: 46%; height: 3.4vh;
    background: repeating-linear-gradient(90deg, #8a5f31 0 3%, transparent 3% 7%), var(--rail);
    border-top: 5px solid var(--ink); border-bottom: 5px solid var(--ink);
  }
  #crates { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; justify-content: center; gap: 6vw; }
  .crate {
    width: min(21vh, 23vw); height: min(21vh, 23vw);
    background: var(--wood); border: 6px solid var(--ink); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 7px 0 var(--ink);
    transition: transform .9s cubic-bezier(.4,0,.3,1), opacity .4s;
  }
  .crate:active { transform: translateY(5px); }
  .crate svg { width: 74%; height: 74%; overflow: visible; }
  .crate.wrong { animation: shake .5s; }
  .crate.loaded { opacity: 0; }

  /* ---------- Count the corners ---------- */
  #cornerScreen .site { flex: 1; display: flex; align-items: center; justify-content: center; background: linear-gradient(var(--sky) 0 76%, var(--grass) 76% 100%); }
  #cornerStage { position: relative; width: min(62vh, 62vw); height: min(62vh, 62vw); }
  #cornerStage > svg { width: 100%; height: 100%; overflow: visible; }
  .cdot {
    position: absolute; width: 15%; height: 15%; padding: 0;
    transform: translate(-50%, -50%);
    border: 5px solid var(--ink); border-radius: 50%; background: #fff;
    font-size: min(5.5vh, 5.5vw); font-weight: 900; line-height: 1; color: transparent;
    display: flex; align-items: center; justify-content: center;
    animation: tapme 1.3s ease-in-out infinite;
  }
  .cdot.counted { background: var(--gold); color: var(--ink); animation: pop .45s; }
  .cdot.wiggle { animation: shake .4s; }
  @keyframes tapme { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.18); } }

  /* ---------- Effects ---------- */
  @keyframes glow { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-4deg); } }

  .confetti { position: fixed; top: -20px; width: 14px; height: 22px; border-radius: 3px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  #trophy {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55);
  }
  #trophy.show { display: flex; }
  #trophy .cup { font-size: 42vh; line-height: 1; animation: pop .8s; }
  #trophy .big { font-size: clamp(36px, 9vh, 84px); font-weight: 900; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
</style>
</head>
<body>

<!-- ============ MENU ============ -->
<section id="menu" class="screen active">
  <a href="../../" class="icon-btn corner" aria-label="All games">🏠</a>
  <h1>Shape Train</h1>
  <div class="menu-row">
    <button class="big-choice" data-mode="build" aria-label="Make a picture">
      <div class="pic" id="picBuild"></div>
      <div class="lbl">Make a picture!</div>
    </button>
    <button class="big-choice" data-mode="load" aria-label="Load the train">
      <div class="pic" id="picLoad"></div>
      <div class="lbl">Load it!</div>
    </button>
    <button class="big-choice" data-mode="corners" aria-label="Count the corners">
      <div class="pic" id="picCorners"></div>
      <div class="lbl">Count corners!</div>
    </button>
  </div>
  <div class="parent">
    Shapes:
    <button data-tier="1">5</button>
    <button data-tier="2">9</button>
    <button data-tier="3">12</button>
    <span class="gap"></span>
    <button data-tilt="1">Tilt them</button>
  </div>
</section>

<!-- ============ MAKE A PICTURE ============ -->
<section id="buildScreen" class="screen">
  <header class="topbar">
    <button class="icon-btn" data-home aria-label="Menu">🏠</button>
    <button class="prompt" id="buildPrompt" aria-label="Say it again">
      <span class="speaker">🔊</span><span class="sign" id="buildSign"></span>
    </button>
    <div class="stars" data-stars></div>
  </header>
  <div class="site">
    <div id="blueprint"></div>
    <div class="tray" id="tray"></div>
  </div>
</section>

<!-- ============ LOAD THE TRAIN ============ -->
<section id="loadScreen" class="screen">
  <header class="topbar">
    <button class="icon-btn" data-home aria-label="Menu">🏠</button>
    <button class="prompt" id="loadPrompt" aria-label="Say it again">
      <span class="speaker">🔊</span><span class="sign" id="loadSign"></span>
    </button>
    <div class="stars" data-stars></div>
  </header>
  <div class="site">
    <div id="rails"></div>
    <div id="train"></div>
    <div id="crates"></div>
  </div>
</section>

<!-- ============ COUNT THE CORNERS ============ -->
<section id="cornerScreen" class="screen">
  <header class="topbar">
    <button class="icon-btn" data-home aria-label="Menu">🏠</button>
    <button class="prompt" id="cornerPrompt" aria-label="Say it again">
      <span class="speaker">🔊</span><span class="sign num" id="cornerSign">?</span>
    </button>
    <div class="stars" data-stars></div>
  </header>
  <div class="site">
    <div id="cornerStage"></div>
  </div>
</section>

<div id="trophy">
  <div class="cup">🏆</div>
  <div class="big" id="trophyText">Shape star!</div>
</div>

<script src="/static/kid-voice.js"></script>
<script>
(function () {
  "use strict";

  /* ---------------- Helpers ---------------- */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[rand(0, arr.length - 1)]; }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }

  var gen = 0;
  function later(ms, fn) { var g = gen; setTimeout(function () { if (g === gen) fn(); }, ms); }

  var settings = { tier: 1, tilt: false };
  try {
    var t = parseInt(localStorage.getItem("shapeTrain.tier"), 10);
    if (t) settings.tier = t;
    settings.tilt = localStorage.getItem("shapeTrain.tilt") === "1";
  } catch (e) {}

  /* ---------------- Shapes ----------------
     Tier 1 is what a three-year-old can name; tier 2 adds the ones that come
     around four; tier 3 the side-counting ones for later. Pictures only appear
     when every shape they need is in the current tier. */
  function regularPoints(n, startDeg, r) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var a = (startDeg + i * 360 / n) * Math.PI / 180;
      pts.push([+(50 + r * Math.cos(a)).toFixed(1), +(50 + r * Math.sin(a)).toFixed(1)]);
    }
    return pts;
  }
  function pathFrom(pts) {
    return '<path d="M' + pts.map(function (p) { return p[0] + " " + p[1]; }).join(" L") + ' Z"/>';
  }
  function regular(n, startDeg, r) { return pathFrom(regularPoints(n, startDeg, r)); }
  function starPath() {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? 19 : 46;
      var a = (-90 + i * 36) * Math.PI / 180;
      pts.push((50 + r * Math.cos(a)).toFixed(1) + " " + (50 + r * Math.sin(a)).toFixed(1));
    }
    return '<path d="M' + pts.join(" L") + ' Z"/>';
  }

  // `corners` lists the vertices for the corner-counting mode; curved shapes have none.
  var SHAPES = {
    circle:    { tier: 1, name: "circle",    d: '<circle cx="50" cy="50" r="45"/>' },
    square:    { tier: 1, name: "square",    d: '<rect x="6" y="6" width="88" height="88" rx="7"/>',
                 corners: [[6, 6], [94, 6], [94, 94], [6, 94]] },
    triangle:  { tier: 1, name: "triangle",  d: '<path d="M50 6 L95 92 L5 92 Z"/>',
                 corners: [[50, 6], [95, 92], [5, 92]] },
    star:      { tier: 1, name: "star",      d: starPath() },
    heart:     { tier: 1, name: "heart",     d: '<path d="M50 92 C10 64 5 34 24 23 C38 15 50 26 50 35 C50 26 62 15 76 23 C95 34 90 64 50 92 Z"/>' },
    rectangle: { tier: 2, name: "rectangle", d: '<rect x="2" y="24" width="96" height="52" rx="7"/>',
                 corners: [[2, 24], [98, 24], [98, 76], [2, 76]] },
    oval:      { tier: 2, name: "oval",      d: '<ellipse cx="50" cy="50" rx="47" ry="31"/>' },
    halfcircle:{ tier: 2, name: "half circle", d: '<path d="M3 73 A47 47 0 0 1 97 73 Z"/>' },
    diamond:   { tier: 2, name: "diamond",   d: '<path d="M50 4 L96 50 L50 96 L4 50 Z"/>',
                 corners: [[50, 4], [96, 50], [50, 96], [4, 50]] },
    pentagon:  { tier: 3, name: "pentagon",  d: regular(5, -90, 46), corners: regularPoints(5, -90, 46) },
    hexagon:   { tier: 3, name: "hexagon",   d: regular(6, -90, 46), corners: regularPoints(6, -90, 46) },
    octagon:   { tier: 3, name: "octagon",   d: regular(8, -67.5, 46), corners: regularPoints(8, -67.5, 46) }
  };
  var SHAPE_KEYS = Object.keys(SHAPES);

  function tierKeys() {
    return SHAPE_KEYS.filter(function (k) { return SHAPES[k].tier <= settings.tier; });
  }

  function shapeSVG(key, fill, rot) {
    var s = SHAPES[key];
    var spin = rot ? ' transform="rotate(' + rot + ' 50 50)"' : "";
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><g' + spin +
      ' fill="' + fill + '" stroke="#1d1d1d" stroke-width="6" stroke-linejoin="round">' + s.d + '</g></svg>';
  }
  function holeSVG(key, rot) {
    var s = SHAPES[key];
    var spin = rot ? ' transform="rotate(' + rot + ' 50 50)"' : "";
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><g' + spin +
      ' fill="rgba(0,0,0,.16)" stroke="#1d1d1d" stroke-width="5" stroke-dasharray="9 7" stroke-linejoin="round">' + s.d + '</g></svg>';
  }
  // A tilted piece, when the grown-up switches tilting on.
  function tilt(key) {
    if (!settings.tilt || key === "circle") return 0;
    return rand(1, 11) * 30;
  }

  var COLORS = ["#e53935", "#1e88e5", "#fdd835", "#43a047", "#fb8c00", "#8e24aa", "#ec407a", "#00acc1"];

  /* ---------------- Pictures ----------------
     Parts are centre x/y and box size, as percentages of a square picture area,
     drawn in order so later parts sit on top. */
  var PICTURES = [
    { say: "You made a house!", parts: [
      { s: "square", cx: 50, cy: 66, size: 58, c: "#fdd835" },
      { s: "triangle", cx: 50, cy: 29, size: 66, c: "#e53935" },
      { s: "square", cx: 50, cy: 79, size: 22, c: "#8e5a2b" },
      { s: "circle", cx: 34, cy: 61, size: 17, c: "#8fd3ff" }
    ] },
    { say: "You made a rocket!", parts: [
      { s: "square", cx: 50, cy: 50, size: 40, c: "#1e88e5" },
      { s: "triangle", cx: 50, cy: 19, size: 36, c: "#e53935" },
      { s: "triangle", cx: 27, cy: 66, size: 26, c: "#e53935", rot: 180 },
      { s: "triangle", cx: 73, cy: 66, size: 26, c: "#e53935", rot: 180 },
      { s: "circle", cx: 50, cy: 47, size: 19, c: "#cdefff" },
      { s: "triangle", cx: 50, cy: 84, size: 30, c: "#fb8c00", rot: 180 }
    ] },
    { say: "You made a cat!", parts: [
      // Ears go first so the head covers their base.
      { s: "triangle", cx: 29, cy: 30, size: 30, c: "#fb8c00" },
      { s: "triangle", cx: 71, cy: 30, size: 30, c: "#fb8c00" },
      { s: "circle", cx: 50, cy: 56, size: 70, c: "#fb8c00" },
      { s: "circle", cx: 34, cy: 48, size: 13, c: "#1d1d1d" },
      { s: "circle", cx: 66, cy: 48, size: 13, c: "#1d1d1d" },
      { s: "heart", cx: 50, cy: 64, size: 22, c: "#ec407a", rot: 180 }
    ] },
    { say: "You made a tree!", parts: [
      { s: "square", cx: 50, cy: 82, size: 22, c: "#8e5a2b" },
      { s: "triangle", cx: 50, cy: 50, size: 60, c: "#43a047" },
      { s: "triangle", cx: 50, cy: 26, size: 46, c: "#43a047" },
      { s: "star", cx: 50, cy: 8, size: 22, c: "#fdd835" }
    ] },
    { say: "You made a flower!", parts: [
      { s: "heart", cx: 50, cy: 25, size: 32, c: "#ec407a", rot: 180 },
      { s: "heart", cx: 50, cy: 75, size: 32, c: "#ec407a" },
      { s: "heart", cx: 25, cy: 50, size: 32, c: "#ec407a", rot: 90 },
      { s: "heart", cx: 75, cy: 50, size: 32, c: "#ec407a", rot: 270 },
      { s: "circle", cx: 50, cy: 50, size: 26, c: "#fdd835" }
    ] },
    { say: "You made an ice cream!", parts: [
      { s: "triangle", cx: 50, cy: 70, size: 44, c: "#b5793c", rot: 180 },
      { s: "circle", cx: 50, cy: 36, size: 46, c: "#ec407a" },
      { s: "heart", cx: 50, cy: 11, size: 18, c: "#e53935" }
    ] },
    { say: "You made a truck!", parts: [
      { s: "rectangle", cx: 40, cy: 50, size: 64, c: "#e53935" },
      { s: "square", cx: 78, cy: 52, size: 32, c: "#e53935" },
      { s: "circle", cx: 28, cy: 76, size: 26, c: "#4b4b55" },
      { s: "circle", cx: 72, cy: 76, size: 26, c: "#4b4b55" }
    ] },
    { say: "You made a boat!", parts: [
      { s: "halfcircle", cx: 50, cy: 70, size: 74, c: "#e53935" },
      { s: "triangle", cx: 52, cy: 34, size: 46, c: "#fdd835" },
      { s: "star", cx: 52, cy: 9, size: 18, c: "#fdd835" }
    ] },
    { say: "You made a kite!", parts: [
      { s: "diamond", cx: 50, cy: 38, size: 58, c: "#8e24aa" },
      { s: "star", cx: 59, cy: 74, size: 17, c: "#fdd835" },
      { s: "star", cx: 66, cy: 89, size: 17, c: "#fdd835" }
    ] },
    { say: "You made a stop sign!", parts: [
      { s: "rectangle", cx: 50, cy: 78, size: 44, c: "#9e9e9e", rot: 90 },
      { s: "octagon", cx: 50, cy: 34, size: 62, c: "#e53935" }
    ] },
    { say: "You made a honeycomb!", parts: [
      { s: "hexagon", cx: 34, cy: 36, size: 42, c: "#fdd835" },
      { s: "hexagon", cx: 66, cy: 36, size: 42, c: "#fdd835" },
      { s: "hexagon", cx: 50, cy: 64, size: 42, c: "#fb8c00" }
    ] }
  ];

  function availablePictures() {
    var keys = tierKeys();
    return PICTURES.filter(function (p) {
      return p.parts.every(function (part) { return keys.indexOf(part.s) >= 0; });
    });
  }

  /* ---------------- Train drawing ---------------- */
  var INK = "#1d1d1d";
  var S = ' stroke="' + INK + '" stroke-width="5" stroke-linejoin="round"';
  function wheel(cx, cy, r) {
    return '<g><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + INK + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.42).toFixed(1) + '" fill="#cfcfcf"/></g>';
  }
  function trainSVG() {
    return '<svg viewBox="0 0 460 170" aria-hidden="true">' +
      // open wagon
      '<rect x="12" y="66" width="190" height="72" rx="8" fill="#43a047"' + S + '/>' +
      '<rect x="26" y="80" width="162" height="46" rx="5" fill="#2f7a33"/>' +
      wheel(56, 146, 18) + wheel(158, 146, 18) +
      '<rect x="202" y="100" width="34" height="10" rx="4" fill="' + INK + '"/>' +
      // locomotive
      '<rect x="236" y="74" width="140" height="64" rx="10" fill="#1e88e5"' + S + '/>' +
      '<path d="M330 74 V28 Q330 20 338 20 L392 20 Q400 20 400 28 V74 Z" fill="#1565c0"' + S + '/>' +
      '<rect x="344" y="32" width="44" height="28" rx="4" fill="#cdefff" stroke="' + INK + '" stroke-width="4"/>' +
      '<path d="M252 74 V44 Q252 36 262 36 L282 36 Q292 36 292 44 V74 Z" fill="#e53935"' + S + '/>' +
      '<ellipse cx="272" cy="30" rx="26" ry="9" fill="#fff" stroke="' + INK + '" stroke-width="4"/>' +
      '<rect x="230" y="132" width="180" height="14" rx="6" fill="#4b4b55"' + S + '/>' +
      wheel(268, 146, 16) + wheel(330, 146, 16) + wheel(388, 146, 20) +
      '</svg>';
  }

  /* ---------------- Sound ---------------- */
  var ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(type, freq, start, dur, vol, endFreq) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + start;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(start, dur, vol, freq) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + start;
    var len = Math.ceil(a.sampleRate * dur);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = a.createBufferSource(); src.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 1200;
    var g = a.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t); src.stop(t + dur);
  }
  function sparkle() { tone("triangle", 880, 0, 0.14, 0.22, 1320); tone("triangle", 1320, 0.1, 0.22, 0.18, 1760); }
  function pop(step) { tone("sine", 440 + step * 55, 0, 0.18, 0.28, 880 + step * 80); }
  function clunk() { noise(0, 0.16, 0.3, 600); tone("sine", 160, 0, 0.14, 0.22, 90); }
  function chuff() { for (var i = 0; i < 6; i++) noise(i * 0.26, 0.2, 0.22, 700); }
  function whistle() {
    tone("sine", 700, 0, 0.5, 0.16, 780); tone("sine", 1050, 0, 0.5, 0.12, 1170);
    tone("sine", 700, 0.5, 0.7, 0.14, 660); tone("sine", 1050, 0.5, 0.7, 0.1, 990);
  }
  function honk() {
    tone("square", 392, 0, 0.16, 0.12); tone("square", 494, 0, 0.16, 0.08);
    tone("square", 392, 0.22, 0.16, 0.12); tone("square", 494, 0.22, 0.16, 0.08);
  }
  function fanfare() {
    [523, 659, 784, 1047].forEach(function (f, i) { tone("triangle", f, i * 0.13, i === 3 ? 0.5 : 0.16, 0.25); });
  }

  /* ---------------- Voice ---------------- */
  KidVoice.init(audio);
  var speak = KidVoice.speak;
  (function preload() {
    var list = ["Yes!", "Let's try again!", "You are a shape star! Hooray!", "Tap the shape that fits!",
      "Count the corners!", "Keep counting!"];
    for (var n = 1; n <= 8; n++) list.push(String(n), n + " corners!");
    SHAPE_KEYS.forEach(function (k) {
      var nm = SHAPES[k].name;
      list.push(nm + "!", "Find a " + nm + "!", "Find the " + nm + "!", "That's a " + nm + ".", "It's a " + nm + "!");
    });
    PICTURES.forEach(function (p) { list.push(p.say); });
    KidVoice.preload(list);
  })();

  /* ---------------- Effects ---------------- */
  function confetti() {
    var cols = ["#e53935", "#1e88e5", "#fdd835", "#43a047", "#fb8c00", "#ec407a", "#fff"];
    for (var i = 0; i < 45; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = cols[i % cols.length];
      c.style.animationDuration = 1.4 + Math.random() * 1.4 + "s";
      c.style.animationDelay = Math.random() * 0.3 + "s";
      document.body.appendChild(c);
      (function (el) { setTimeout(function () { el.remove(); }, 3300); })(c);
    }
  }
  function flash(cls, el) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  var stars = 0;
  function renderStars() {
    $$("[data-stars]").forEach(function (box) {
      var h = "";
      for (var i = 0; i < 5; i++) h += '<span class="' + (i < stars ? "got" : "") + '">★</span>';
      box.innerHTML = h;
    });
  }
  function winRound(next) {
    stars++;
    renderStars();
    if (stars < 5) { later(2600, next); return; }
    later(2200, function () {
      var t = $("#trophy");
      t.classList.add("show");
      fanfare(); confetti();
      speak("You are a shape star! Hooray!");
      var done = false;
      var close = function () {
        if (done) return; done = true;
        t.classList.remove("show"); t.removeEventListener("pointerdown", close);
        stars = 0; renderStars(); next();
      };
      later(4000, function () { t.addEventListener("pointerdown", close); });
      later(7000, close);
    });
  }

  /* ---------------- Screens ---------------- */
  function show(id) {
    gen++;
    KidVoice.stop();
    $("#trophy").classList.remove("show");
    $$(".screen").forEach(function (s) { s.classList.toggle("active", s.id === id); });
  }
  function goFullscreen() {
    var d = document.documentElement;
    var req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
      try {
        var p = req.call(d);
        if (p && p.then) p.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
        }).catch(function () {});
      } catch (e) {}
    }
  }

  /* ---------------- Mode: make a picture ---------------- */
  var build = { pic: null, step: 0, locked: true, lastSay: "" };

  function buildRound() {
    gen++;
    var choices = availablePictures().filter(function (p) { return p.say !== build.lastSay; });
    build.pic = pick(choices.length ? choices : availablePictures());
    build.lastSay = build.pic.say;
    build.step = 0;
    build.locked = true;

    var bp = $("#blueprint");
    bp.innerHTML = "";
    build.pic.parts.forEach(function (part, i) {
      var el = document.createElement("div");
      el.className = "part hole";
      el.style.left = (part.cx - part.size / 2) + "%";
      el.style.top = (part.cy - part.size / 2) + "%";
      el.style.width = part.size + "%";
      el.style.height = part.size + "%";
      el.innerHTML = holeSVG(part.s, part.rot || 0);
      el.dataset.index = i;
      bp.appendChild(el);
    });
    nextPart();
  }

  function nextPart() {
    var parts = build.pic.parts;
    if (build.step >= parts.length) { buildDone(); return; }
    var part = parts[build.step];
    $$(".part", $("#blueprint")).forEach(function (el, i) { el.classList.toggle("target", i === build.step); });
    // The prompt shape is plain white and the pieces get unrelated colours, so the
    // answer can only be found by shape — never by matching the colour.
    $("#buildSign").innerHTML = shapeSVG(part.s, "#fff", 0);
    flash("pulse", $("#buildSign"));

    var others = tierKeys().filter(function (k) { return k !== part.s; });
    var opts = [part.s].concat(shuffle(others).slice(0, 2));
    shuffle(opts);
    var cols = shuffle(COLORS.slice());
    var tray = $("#tray");
    tray.innerHTML = "";
    opts.forEach(function (key, i) {
      var b = document.createElement("button");
      b.className = "piece";
      b.innerHTML = shapeSVG(key, cols[i], tilt(key));
      b.addEventListener("pointerdown", function () { pieceTap(b, key); });
      tray.appendChild(b);
    });
    build.locked = false;
    speak("Find a " + SHAPES[part.s].name + "!");
  }

  function pieceTap(btn, key) {
    if (build.locked) return;
    var part = build.pic.parts[build.step];
    if (key !== part.s) {
      build.locked = true;
      flash("wrong", btn);
      honk();
      speak("That's a " + SHAPES[key].name + ".");
      later(1100, function () {
        speak("Find a " + SHAPES[part.s].name + "!");
        build.locked = false;
      });
      return;
    }
    build.locked = true;
    var hole = $$(".part", $("#blueprint"))[build.step];
    // Fly the piece from the tray into its place.
    var from = btn.getBoundingClientRect(), to = hole.getBoundingClientRect();
    btn.style.transform = "translate(" + (to.left + to.width / 2 - from.left - from.width / 2) + "px," +
      (to.top + to.height / 2 - from.top - from.height / 2) + "px) scale(" + (to.width / from.width) + ")";
    btn.style.zIndex = 5;
    later(560, function () {
      btn.classList.add("gone");
      hole.classList.remove("hole", "target");
      hole.classList.add("placed");
      hole.innerHTML = shapeSVG(part.s, part.c, part.rot || 0);
      sparkle(); clunk();
      speak(SHAPES[part.s].name + "!");
      build.step++;
      later(700, nextPart);
    });
  }

  function buildDone() {
    $("#tray").innerHTML = "";
    fanfare(); confetti();
    speak(build.pic.say);
    winRound(buildRound);
  }

  $("#buildPrompt").addEventListener("pointerdown", function () {
    if (build.step >= build.pic.parts.length) { speak(build.pic.say); return; }
    flash("pulse", $("#buildSign"));
    speak("Find a " + SHAPES[build.pic.parts[build.step].s].name + "!");
  });

  /* ---------------- Mode: load the train ---------------- */
  var load = { target: "", last: "", locked: false };

  function loadRound() {
    gen++;
    load.locked = false;
    var keys = tierKeys();
    var target;
    do { target = pick(keys); } while (target === load.last && keys.length > 1);
    load.last = load.target = target;

    var opts = [target].concat(shuffle(keys.filter(function (k) { return k !== target; })).slice(0, 2));
    shuffle(opts);
    var cols = shuffle(COLORS.slice());

    $("#train").classList.remove("away");
    var box = $("#crates");
    box.innerHTML = "";
    opts.forEach(function (key, i) {
      var c = document.createElement("button");
      c.className = "crate";
      c.innerHTML = shapeSVG(key, cols[i], tilt(key));
      c.addEventListener("pointerdown", function () { crateTap(c, key); });
      box.appendChild(c);
    });
    $("#loadSign").innerHTML = shapeSVG(target, "#fff", 0);
    flash("pulse", $("#loadSign"));
    later(400, function () { speak("Find the " + SHAPES[target].name + "!"); });
  }

  function crateTap(crate, key) {
    if (load.locked) return;
    if (key !== load.target) {
      load.locked = true;
      flash("wrong", crate);
      honk();
      speak("That's a " + SHAPES[key].name + ".");
      later(1100, function () {
        speak("Find the " + SHAPES[load.target].name + "!");
        load.locked = false;
      });
      return;
    }
    load.locked = true;
    var wagon = $("#train").getBoundingClientRect();
    var from = crate.getBoundingClientRect();
    crate.style.transform = "translate(" + (wagon.left + wagon.width * 0.22 - from.left) + "px," +
      (wagon.top + wagon.height * 0.55 - from.top) + "px) scale(.55)";
    sparkle();
    speak(SHAPES[key].name + "!");
    later(900, function () {
      crate.classList.add("loaded");
      clunk();
      later(400, function () {
        whistle(); chuff();
        $("#train").classList.add("away");
        // Only start the next round once the train has actually left.
        winRound(loadRound);
      });
    });
  }

  $("#loadPrompt").addEventListener("pointerdown", function () {
    flash("pulse", $("#loadSign"));
    speak("Find the " + SHAPES[load.target].name + "!");
  });

  /* ---------------- Mode: count the corners ----------------
     The bridge between counting and the harder shape names: a hexagon is the
     shape you get after counting six corners. */
  var corners = { key: "", total: 0, counted: 0, last: "", locked: false };

  function cornerKeys() {
    return tierKeys().filter(function (k) { return SHAPES[k].corners; });
  }

  function cornerRound() {
    gen++;
    corners.counted = 0;
    corners.locked = false;
    var keys = cornerKeys();
    var key;
    do { key = pick(keys); } while (key === corners.last && keys.length > 1);
    corners.last = corners.key = key;
    var shape = SHAPES[key];
    corners.total = shape.corners.length;

    var rot = tilt(key);
    var stage = $("#cornerStage");
    stage.innerHTML = shapeSVG(key, pick(COLORS), rot);
    var rad = rot * Math.PI / 180;
    shape.corners.forEach(function (pt) {
      // Turn the corner with the shape when tilting is on.
      var x = 50 + (pt[0] - 50) * Math.cos(rad) - (pt[1] - 50) * Math.sin(rad);
      var y = 50 + (pt[0] - 50) * Math.sin(rad) + (pt[1] - 50) * Math.cos(rad);
      var dot = document.createElement("button");
      dot.className = "cdot";
      dot.style.left = x + "%";
      dot.style.top = y + "%";
      dot.addEventListener("pointerdown", function () { cornerTap(dot); });
      stage.appendChild(dot);
    });
    $("#cornerSign").textContent = "?";
    later(400, function () { speak("Count the corners!"); });
  }

  function cornerTap(dot) {
    if (corners.locked) return;
    if (dot.classList.contains("counted")) { flash("wiggle", dot); return; }
    corners.counted++;
    dot.classList.add("counted");
    dot.textContent = corners.counted;
    pop(corners.counted);
    speak(String(corners.counted));
    var sign = $("#cornerSign");
    sign.textContent = corners.counted;
    flash("pulse", sign);
    if (corners.counted === corners.total) {
      corners.locked = true;
      later(900, function () {
        speak([corners.total + " corners!", "It's a " + SHAPES[corners.key].name + "!"]);
        fanfare(); confetti();
        winRound(cornerRound);
      });
    }
  }

  $("#cornerPrompt").addEventListener("pointerdown", function () {
    if (corners.counted === 0) speak("Count the corners!");
    else if (corners.counted < corners.total) speak([String(corners.counted), "Keep counting!"]);
    else speak("It's a " + SHAPES[corners.key].name + "!");
  });

  /* ---------------- Menu ---------------- */
  function renderMenu() {
    $$("[data-tier]").forEach(function (b) { b.classList.toggle("on", +b.getAttribute("data-tier") === settings.tier); });
    $$("[data-tilt]").forEach(function (b) { b.classList.toggle("on", settings.tilt); });
    $("#picBuild").innerHTML = shapeSVG("triangle", "#e53935", 0) + shapeSVG("square", "#fdd835", 0) + shapeSVG("circle", "#1e88e5", 0);
    $("#picLoad").innerHTML = trainSVG();
    // A hexagon with numbered corners, showing what the mode is.
    var hex = SHAPES.hexagon.corners.map(function (p, i) {
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="13" fill="#ffc400" stroke="#1d1d1d" stroke-width="5"/>' +
        '<text x="' + p[0] + '" y="' + (p[1] + 1) + '" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="900" font-family="Arial Black, Arial, sans-serif">' + (i + 1) + '</text>';
    }).join("");
    $("#picCorners").innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<g fill="#43a047" stroke="#1d1d1d" stroke-width="6" stroke-linejoin="round">' + SHAPES.hexagon.d + '</g>' + hex + '</svg>';
  }
  $$("[data-tier]").forEach(function (b) {
    b.addEventListener("click", function () {
      settings.tier = +b.getAttribute("data-tier");
      try { localStorage.setItem("shapeTrain.tier", settings.tier); } catch (e) {}
      renderMenu();
    });
  });
  $$("[data-tilt]").forEach(function (b) {
    b.addEventListener("click", function () {
      settings.tilt = !settings.tilt;
      try { localStorage.setItem("shapeTrain.tilt", settings.tilt ? "1" : "0"); } catch (e) {}
      renderMenu();
    });
  });
  renderMenu();
  $("#train").innerHTML = trainSVG();

  $$(".big-choice").forEach(function (b) {
    b.addEventListener("click", function () {
      audio();
      goFullscreen();
      stars = 0; renderStars();
      var mode = b.getAttribute("data-mode");
      if (mode === "build") { show("buildScreen"); buildRound(); }
      else if (mode === "corners") { show("cornerScreen"); cornerRound(); }
      else { show("loadScreen"); loadRound(); }
    });
  });
  $$("[data-home]").forEach(function (b) {
    b.addEventListener("click", function () { show("menu"); });
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  renderStars();

  // Exposed so the picture layouts can be previewed all at once when testing.
  window.__shapeTrain = { PICTURES: PICTURES, SHAPES: SHAPES, shapeSVG: shapeSVG };
})();
</script>
