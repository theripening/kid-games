<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<title>Number Race</title>
<style>
  :root {
    --sky: #8fd3ff;
    --grass: #5cc15c;
    --road: #4b4b55;
    --ink: #1d1d1d;
    --gold: #ffc400;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--grass);
    font-family: "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  #menu {
    background: linear-gradient(var(--sky) 0 58%, var(--grass) 58% 100%);
    align-items: center; justify-content: center; gap: 3vh;
  }
  #menu h1 {
    margin: 0; font-size: clamp(40px, 11vh, 96px); font-weight: 900; letter-spacing: 1px;
    color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 6px 0 rgba(0,0,0,.2);
  }
  .menu-row { display: flex; gap: 4vw; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .big-choice {
    width: clamp(220px, 38vw, 440px); height: clamp(180px, 46vh, 360px);
    background: #fff; border: 8px solid var(--ink); border-radius: 36px;
    box-shadow: 0 10px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    padding: 16px;
    transition: transform .1s;
  }
  .big-choice:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); }
  .big-choice .pic { width: 100%; height: 70%; display: flex; align-items: center; justify-content: center; gap: 2%; }
  .big-choice .pic svg { height: 100%; width: auto; max-width: 100%; }
  .big-choice .pic.three svg { height: 55%; max-width: 32%; }
  .big-choice .lbl { font-size: clamp(26px, 6vh, 52px); font-weight: 900; }
  .parent {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 10px 6px 18px;
    font-size: 18px; font-weight: 700;
  }
  .parent button {
    border: 3px solid var(--ink); background: #fff; border-radius: 999px;
    min-width: 58px; height: 44px; font-size: 20px; font-weight: 900;
  }
  .parent button.on { background: var(--gold); }

  .icon-btn {
    width: clamp(56px, 11vh, 90px); height: clamp(56px, 11vh, 90px); flex: none;
    border: 5px solid var(--ink); border-radius: 50%; background: #fff;
    font-size: clamp(28px, 6vh, 48px); line-height: 1;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    box-shadow: 0 5px 0 var(--ink);
  }
  .icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .corner { position: absolute; top: 16px; left: 16px; }

  /* ---------- Shared top bar ---------- */
  .topbar {
    height: clamp(76px, 17vh, 130px); flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 16px; background: var(--sky);
    border-bottom: 6px solid var(--ink);
  }
  .prompt {
    display: flex; align-items: center; gap: 14px;
    height: 84%; padding: 0 26px;
    background: #fff; border: 6px solid var(--ink); border-radius: 26px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .prompt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .prompt .speaker { font-size: clamp(26px, 6vh, 50px); }
  .prompt .sign { font-size: clamp(48px, 12.5vh, 104px); font-weight: 900; line-height: 1; min-width: 1.2em; text-align: center; }
  .prompt .sign.pulse { animation: pulse .5s; }
  .stars { display: flex; gap: 4px; font-size: clamp(26px, 6.5vh, 54px); line-height: 1; }
  .stars span { color: rgba(0,0,0,.18); transition: color .3s; }
  .stars span.got { color: var(--gold); -webkit-text-stroke: 2px var(--ink); animation: pop .5s; }

  /* ---------- Find the number: race track ---------- */
  .track { flex: 1; display: flex; flex-direction: column; background: var(--road); }
  .lane {
    flex: 1; position: relative; overflow: hidden;
    border-bottom: 6px dashed rgba(255,255,255,.75);
  }
  .lane:last-child { border-bottom: none; }
  .finish {
    position: absolute; right: 5%; top: 0; bottom: 0; width: 32px;
    background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 32px 32px;
  }
  .racer {
    position: absolute; left: 3%; top: 50%; height: 86%;
    transform: translate(0, -50%);
    transition: transform .7s cubic-bezier(.2,.8,.3,1);
  }
  .racer.enter { transform: translate(-130%, -50%); }
  .racer.driving { transition: transform 1.4s cubic-bezier(.55,0,.85,.4); }
  .racer svg, .pcar svg { height: 100%; width: auto; display: block; overflow: visible; }
  .racer svg { max-width: 62vw; animation: idle 1.4s ease-in-out infinite; }
  .lane.dim .racer { opacity: .45; transition: opacity .4s, transform 1.4s; }

  /* ---------- Count the cars: parking lot ---------- */
  .lot {
    flex: 1; display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: 3vh 3vw; padding: 3vh 3vw; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(20% - 6px), rgba(255,255,255,.5) calc(20% - 6px) 20%),
      var(--road);
  }
  .pcar {
    width: var(--cw, 22vw); height: calc(var(--cw, 22vw) * .5);
    display: flex; justify-content: center;
    transition: transform 1.3s cubic-bezier(.55,0,.85,.4);
  }
  .pcar svg { width: 100%; height: auto; }
  .pcar.counted svg .roundel { fill: var(--gold); }

  /* ---------- Effects ---------- */
  .driving .wheel, .pcar.driving .wheel { animation: spin .22s linear infinite; }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .shake svg { animation: shake .5s; }
  .hop svg { animation: hop .45s; }

  @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5%); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-7deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(3deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-18%) scale(1.08); } }
  @keyframes pop { 0% { transform: scale(.3); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

  .confetti { position: fixed; top: -20px; width: 14px; height: 22px; border-radius: 3px; pointer-events: none; z-index: 50; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  #trophy {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55);
  }
  #trophy.show { display: flex; }
  #trophy .cup { font-size: 45vh; line-height: 1; animation: pop .8s, idle 1.2s ease-in-out .8s infinite; }
  #trophy .big { font-size: clamp(40px, 10vh, 90px); font-weight: 900; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
</style>
</head>
<body>

<!-- ============ MENU ============ -->
<section id="menu" class="screen active">
  <a href="../../" class="icon-btn corner" aria-label="All games">🏠</a>
  <h1>Number Race</h1>
  <div class="menu-row">
    <button class="big-choice" data-mode="find" aria-label="Find the number">
      <div class="pic" id="menuFindPic"></div>
      <div class="lbl">Find it!</div>
    </button>
    <button class="big-choice" data-mode="count" aria-label="Count the cars">
      <div class="pic three" id="menuCountPic"></div>
      <div class="lbl">Count!</div>
    </button>
  </div>
  <div class="parent">
    Numbers up to:
    <button data-max="5">5</button>
    <button data-max="10">10</button>
    <button data-max="20">20</button>
  </div>
</section>

<!-- ============ FIND THE NUMBER ============ -->
<section id="find" class="screen">
  <header class="topbar">
    <button class="icon-btn" data-home aria-label="Menu">🏠</button>
    <button class="prompt" id="findPrompt" aria-label="Say it again">
      <span class="speaker">🔊</span><span class="sign" id="findSign">1</span>
    </button>
    <div class="stars" data-stars></div>
  </header>
  <div class="track" id="track"></div>
</section>

<!-- ============ COUNT THE CARS ============ -->
<section id="count" class="screen">
  <header class="topbar">
    <button class="icon-btn" data-home aria-label="Menu">🏠</button>
    <button class="prompt" id="countPrompt" aria-label="Say it again">
      <span class="speaker">🔊</span><span class="sign" id="countSign">?</span>
    </button>
    <div class="stars" data-stars></div>
  </header>
  <div class="lot" id="lot"></div>
</section>

<div id="trophy">
  <div class="cup">🏆</div>
  <div class="big">You won the race!</div>
</div>

<script src="/static/kid-voice.js"></script>
<script>
(function () {
  "use strict";

  /* ---------------- Helpers ---------------- */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }

  // Every round bumps `gen`; delayed callbacks from an old round check it and bail out.
  var gen = 0;
  function later(ms, fn) { var g = gen; setTimeout(function () { if (g === gen) fn(); }, ms); }

  var settings = { max: 5 };
  try { var saved = parseInt(localStorage.getItem("numberRace.max"), 10); if (saved) settings.max = saved; } catch (e) {}

  /* ---------------- Car drawing ---------------- */
  var COLORS = [
    ["#e53935", "#8e1c1a"], ["#1e88e5", "#0d4a8a"], ["#fdd835", "#a8900c"], ["#43a047", "#1f5e22"],
    ["#fb8c00", "#a35a00"], ["#8e24aa", "#541466"], ["#ec407a", "#9c1f4a"], ["#00acc1", "#006670"]
  ];

  function wheel(cx) {
    return '<g class="wheel"><circle cx="' + cx + '" cy="100" r="22" fill="#1d1d1d"/>' +
      '<circle cx="' + cx + '" cy="100" r="10" fill="#cfcfcf"/>' +
      '<path d="M' + cx + ' 88 V112 M' + (cx - 12) + ' 100 H' + (cx + 12) + '" stroke="#1d1d1d" stroke-width="3"/></g>';
  }

  function carSVG(color, label) {
    label = label == null ? "" : String(label);
    var fs = label.length > 1 ? 34 : 42;
    return '<svg viewBox="0 0 260 128" aria-hidden="true">' +
      '<ellipse cx="132" cy="120" rx="112" ry="7" fill="rgba(0,0,0,.3)"/>' +
      '<rect x="30" y="36" width="10" height="26" fill="#1d1d1d"/>' +
      '<rect x="6" y="26" width="48" height="13" rx="4" fill="' + color[1] + '" stroke="#1d1d1d" stroke-width="4"/>' +
      '<path d="M14 72 Q14 54 34 52 L80 50 L101 25 Q107 18 117 18 L158 18 Q170 18 178 28 L196 50 L226 56 Q250 62 250 82 L250 90 Q250 100 240 100 L24 100 Q14 100 14 90 Z" fill="' + color[0] + '" stroke="#1d1d1d" stroke-width="5" stroke-linejoin="round"/>' +
      '<path d="M109 30 Q113 26 119 26 L156 26 Q164 26 169 32 L182 49 L96 49 Z" fill="#cdefff" stroke="#1d1d1d" stroke-width="4" stroke-linejoin="round"/>' +
      '<circle cx="241" cy="72" r="6" fill="#fff6a8" stroke="#1d1d1d" stroke-width="3"/>' +
      wheel(62) + wheel(200) +
      '<circle class="roundel" cx="131" cy="74" r="27" fill="#fff" stroke="#1d1d1d" stroke-width="4"/>' +
      '<text class="num" x="131" y="75" text-anchor="middle" dominant-baseline="central" font-size="' + fs + '" font-weight="900" fill="#1d1d1d" font-family="Arial Black, Arial, sans-serif">' + label + '</text>' +
      '</svg>';
  }

  /* ---------------- Sound ---------------- */
  var ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(type, freq, start, dur, vol, endFreq) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + start;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function vroom() {
    var a = audio(); if (!a) return;
    var t = a.currentTime;
    var o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    var lfo = a.createOscillator(), lfoGain = a.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(55, t);
    o.frequency.exponentialRampToValueAtTime(230, t + 0.7);
    o.frequency.exponentialRampToValueAtTime(160, t + 1.5);
    f.type = "lowpass"; f.frequency.value = 1100;
    lfo.frequency.value = 28; lfoGain.gain.value = 0.08;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t); lfo.start(t); o.stop(t + 1.7); lfo.stop(t + 1.7);
  }
  function honk() {
    tone("square", 392, 0, 0.16, 0.12); tone("square", 494, 0, 0.16, 0.08);
    tone("square", 392, 0.22, 0.16, 0.12); tone("square", 494, 0.22, 0.16, 0.08);
  }
  function pop(step) { tone("sine", 440 + step * 60, 0, 0.18, 0.3, 880 + step * 90); }
  function fanfare() {
    [523, 659, 784, 1047].forEach(function (f, i) { tone("triangle", f, i * 0.13, i === 3 ? 0.5 : 0.16, 0.25); });
  }

  /* ---------------- Speech ---------------- */
  // Voice clips come from the server (see /static/kid-voice.js) and play on the game's audio context.
  KidVoice.init(audio);
  var speak = KidVoice.speak;
  (function preload() {
    var list = ["You won the race! Hooray!", "Tap the car!", "Let's count the cars! Tap each one.", "Keep counting!"];
    for (var n = 1; n <= 10; n++) list.push(String(n), "Find number " + n + "!", "Yes! " + n + "!", n + (n === 1 ? " car!" : " cars!") + " Vroom!");
    KidVoice.preload(list);
  })();

  /* ---------------- Effects ---------------- */
  function confetti() {
    var cols = ["#e53935", "#1e88e5", "#fdd835", "#43a047", "#fb8c00", "#ec407a", "#fff"];
    for (var i = 0; i < 45; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = cols[i % cols.length];
      c.style.animationDuration = 1.4 + Math.random() * 1.4 + "s";
      c.style.animationDelay = Math.random() * 0.3 + "s";
      document.body.appendChild(c);
      (function (el) { setTimeout(function () { el.remove(); }, 3300); })(c);
    }
  }
  function flash(cls, el) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }

  var stars = 0;
  function renderStars() {
    $$("[data-stars]").forEach(function (box) {
      var h = "";
      for (var i = 0; i < 5; i++) h += '<span class="' + (i < stars ? "got" : "") + '">★</span>';
      box.innerHTML = h;
    });
  }
  // Adds a star; after 5 shows the trophy, then calls next().
  function winRound(next) {
    stars++;
    renderStars();
    if (stars < 5) { later(2200, next); return; }
    later(1800, function () {
      var t = $("#trophy");
      t.classList.add("show");
      fanfare(); confetti();
      speak("You won the race! Hooray!");
      var done = false;
      var close = function () {
        if (done) return; done = true;
        t.classList.remove("show"); t.removeEventListener("pointerdown", close);
        stars = 0; renderStars(); next();
      };
      later(4000, function () { t.addEventListener("pointerdown", close); });
      later(7000, close);
    });
  }

  /* ---------------- Screens ---------------- */
  function show(id) {
    gen++;
    KidVoice.stop();
    $("#trophy").classList.remove("show");
    $$(".screen").forEach(function (s) { s.classList.toggle("active", s.id === id); });
  }

  function goFullscreen() {
    var d = document.documentElement;
    var req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
      try {
        var p = req.call(d);
        if (p && p.then) p.then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
        }).catch(function () {});
      } catch (e) {}
    }
  }

  /* ---------------- Mode: Find the number ---------------- */
  var find = { target: 0, last: 0, locked: false };

  function findRound() {
    gen++;
    find.locked = false;
    var max = settings.max, t;
    do { t = rand(1, max); } while (t === find.last);
    find.last = find.target = t;

    var nums = [t];
    while (nums.length < 3) { var n = rand(1, max); if (nums.indexOf(n) < 0) nums.push(n); }
    shuffle(nums);
    var cols = shuffle(COLORS.slice());

    var track = $("#track");
    track.innerHTML = "";
    nums.forEach(function (n, i) {
      var lane = document.createElement("div");
      lane.className = "lane";
      lane.innerHTML = '<div class="finish"></div><div class="racer enter">' + carSVG(cols[i], n) + "</div>";
      lane.addEventListener("pointerdown", function () { findTap(lane, n); });
      track.appendChild(lane);
    });
    void track.offsetWidth;
    $$(".racer", track).forEach(function (r, i) { setTimeout(function () { r.classList.remove("enter"); }, i * 120); });

    var sign = $("#findSign");
    sign.textContent = t;
    flash("pulse", sign);
    later(450, function () { speak("Find number " + t + "!"); });
  }

  function findTap(lane, n) {
    if (find.locked) return;
    var racer = $(".racer", lane);
    if (n === find.target) {
      find.locked = true;
      $$(".lane", $("#track")).forEach(function (l) { if (l !== lane) l.classList.add("dim"); });
      racer.classList.add("driving");
      racer.style.transform = "translate(" + (lane.clientWidth + 40) + "px, -50%)";
      vroom();
      speak("Yes! " + n + "!");
      later(700, confetti);
      winRound(findRound);
    } else {
      find.locked = true;
      flash("shake", racer);
      honk();
      speak("That's " + n + ". Find " + find.target + "!");
      later(700, function () { find.locked = false; });
    }
  }

  $("#findPrompt").addEventListener("pointerdown", function () {
    flash("pulse", $("#findSign"));
    speak("Find number " + find.target + "!");
  });

  /* ---------------- Mode: Count the cars ---------------- */
  var count = { total: 0, done: 0, last: 0, locked: false };

  function countRound() {
    gen++;
    var max = Math.min(settings.max, 10), n;
    do { n = rand(1, max); } while (n === count.last && max > 1);
    count.last = count.total = n;
    count.done = 0;
    count.locked = false;

    var lot = $("#lot");
    var cols = shuffle(COLORS.slice());
    var perRow = n <= 5 ? n : Math.ceil(n / 2);
    var rows = n <= 5 ? 1 : 2;
    // Fit cars by both width and height (car is 2:1).
    var w = Math.min((88 - 3 * (perRow - 1)) / perRow,(62 / rows) * 2 * (window.innerHeight / window.innerWidth), 34);
    lot.style.setProperty("--cw", w + "vw");
    lot.innerHTML = "";
    for (var i = 0; i < n; i++) {
      var car = document.createElement("div");
      car.className = "pcar";
      car.innerHTML = carSVG(cols[i % cols.length], "");
      car.addEventListener("pointerdown", countTap.bind(null, car));
      lot.appendChild(car);
    }
    $("#countSign").textContent = "?";
    later(400, function () { speak(n === 1 ? "Tap the car!" : "Let's count the cars! Tap each one."); });
  }

  function countTap(car) {
    if (count.locked) return;
    if (car.classList.contains("counted")) { flash("shake", car); return; }
    count.done++;
    var k = count.done;
    car.classList.add("counted");
    $(".num", car).textContent = k;
    if (k > 9) $(".num", car).setAttribute("font-size", "34");
    flash("hop", car);
    pop(k);
    speak(String(k));
    var sign = $("#countSign");
    sign.textContent = k;
    flash("pulse", sign);

    if (k === count.total) {
      count.locked = true;
      later(900, function () {
        speak(k + (k === 1 ? " car!" : " cars!") + " Vroom!");
        fanfare(); confetti();
        flash("pulse", sign);
      });
      later(2000, function () {
        vroom();
        $$(".pcar", $("#lot")).forEach(function (c, i) {
          setTimeout(function () {
            c.classList.add("driving");
            c.style.transform = "translateX(" + (window.innerWidth + 50) + "px)";
          }, i * 90);
        });
      });
      later(1400, function () { winRound(countRound); });
    }
  }

  $("#countPrompt").addEventListener("pointerdown", function () {
    if (count.done === 0) speak("Let's count the cars! Tap each one.");
    else if (count.done < count.total) speak([String(count.done), "Keep counting!"]);
    else speak(count.total + " cars!");
  });

  /* ---------------- Menu wiring ---------------- */
  $("#menuFindPic").innerHTML = carSVG(COLORS[0], 3);
  $("#menuCountPic").innerHTML = carSVG(COLORS[1], 1) + carSVG(COLORS[2], 2) + carSVG(COLORS[3], 3);

  function renderMax() {
    $$("[data-max]").forEach(function (b) { b.classList.toggle("on", +b.getAttribute("data-max") === settings.max); });
  }
  $$("[data-max]").forEach(function (b) {
    b.addEventListener("click", function () {
      settings.max = +b.getAttribute("data-max");
      try { localStorage.setItem("numberRace.max", settings.max); } catch (e) {}
      renderMax();
    });
  });
  renderMax();

  $$(".big-choice").forEach(function (b) {
    b.addEventListener("click", function () {
      audio();
      goFullscreen();
      var mode = b.getAttribute("data-mode");
      show(mode);
      stars = 0; renderStars();
      if (mode === "find") findRound(); else countRound();
    });
  });
  $$("[data-home]").forEach(function (b) {
    b.addEventListener("click", function () { show("menu"); });
  });

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  renderStars();
})();
</script>
</body>
</html>
